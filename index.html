<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DualSense Explorer</title><style>body{background:#0b1930;color:#edf5ff;font:16px system-ui;margin:0;padding:18px}main{max-width:850px;margin:auto}svg{width:100%;background:#193d61;border-radius:16px}input{width:100%}button{padding:13px;margin:5px;border:0;border-radius:9px;background:#dbeaff;color:#14243a;font-weight:bold}g.part{transition:transform .15s}</style><main><h2>🎮 DualSense Explorer · Web Test</h2><p>Arrastra la barra: los componentes deben separarse.</p><svg viewBox="0 0 600 420" aria-label="Vista esquemática del mando"><path d="M145 95 Q180 65 240 85 L360 85 Q420 65 455 95 L540 310 Q560 365 515 370 Q490 372 460 330 L400 255 Q300 280 200 255 L140 330 Q110 375 85 370 Q40 360 60 310Z" fill="#e8eef5" stroke="#9eabb9" stroke-width="5"/><g id="board" class="part"><rect x="205" y="125" width="190" height="85" rx="13" fill="#2d9a77" stroke="#12543f" stroke-width="5"/><text x="300" y="175" text-anchor="middle" fill="white" font-size="22">PCB</text></g><g id="battery" class="part"><rect x="240" y="218" width="120" height="57" rx="8" fill="#d6a44c" stroke="#71511b" stroke-width="4"/><text x="300" y="252" text-anchor="middle" font-size="20">Li-ion</text></g><g id="sticks" class="part"><circle cx="205" cy="193" r="31" fill="#343e4e" stroke="#151b25" stroke-width="9"/><circle cx="395" cy="193" r="31" fill="#343e4e" stroke="#151b25" stroke-width="9"/></g><g id="motors" class="part"><rect x="100" y="275" width="70" height="35" rx="14" fill="#b77b47"/><rect x="430" y="275" width="70" height="35" rx="14" fill="#b77b47"/></g><g id="triggers" class="part"><rect x="155" y="65" width="80" height="28" rx="8" fill="#788a9b"/><rect x="365" y="65" width="80" height="28" rx="8" fill="#788a9b"/></g></svg><p>Separación: <output id="value">0%</output></p><input id="slider" type="range" min="0" max="100" value="0"><p><button id="animate">▶ Animar ensamblaje</button><button id="reset">↻ Restablecer</button></p><p id="status">Esperando JavaScript…</p><small>Representación didáctica 2D. No es un CAD oficial de Sony.</small></main><script>(()=>{const s=document.getElementById('slider'),v=document.getElementById('value'),status=document.getElementById('status');let timer;const moves={board:[0,-100],battery:[0,105],sticks:[-85,0],motors:[0,65],triggers:[0,-65]};function render(){let t=Number(s.value)/100;for(const [id,[x,y]] of Object.entries(moves)){document.getElementById(id).setAttribute('transform','translate('+(x*t)+' '+(y*t)+')')}v.textContent=s.value+'%';status.textContent=t?'JavaScript activo · separación '+s.value+'%':'JavaScript activo · piezas ensambladas'}s.addEventListener('input',()=>{clearInterval(timer);render()});document.getElementById('reset').onclick=()=>{clearInterval(timer);s.value=0;render()};document.getElementById('animate').onclick=()=>{clearInterval(timer);s.value=100;render();timer=setInterval(()=>{s.value=Math.max(0,Number(s.value)-2);render();if(Number(s.value)===0)clearInterval(timer)},35)};render()})();</script></html>
